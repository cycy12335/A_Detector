# CW-003 / IEEE-CIS 泄漏安全建模配置
#
# 所有相对路径相对项目根目录解析；不得写入绝对路径、凭据或机器专属值。
# 本文件自身参与版本标识：脚本会计算并把它写入报告（config_sha256）。
#
# 纪律（本工作包的核心）：
#   - 任何数据驱动的决策（缺失率、常量、类别基数、分位数）只在 **train** 分区拟合；
#     validation / test 只应用已冻结的决策。
#   - 阈值、成本场景、模型参数、特征清单都在**查看 test 指标之前**由本文件固定。
#   - test 只在阈值冻结后评估一次；不得据 test 结果回改本文件并覆盖首次结果。

work_package: CW-003
seed: 42

dataset:
  id: ieee_cis_fraud_detection
  # 开工门禁：两个原始文件的 SHA-256 必须严格等于下列值（来自 CW-002 审计产物）。
  # 任一不符 -> blocked，不得自行替换文件或重算切分。
  expected_fingerprints:
    train_transaction.csv: 3a5c83ab6b3cc13dcabe5ffa9f522307fd5f7f7b6e6f6a60c32284ca6283d642
    train_identity.csv: b63c725d8377be90a995268d97f347c17d456b95db45807adcf9f59cd603c37c
  # 分区必须复用 CW-002 的行级清单，不在本工作包重新推导或随机切分。
  split_algorithm_version: temporal_tie_safe_v1
  expected_split_sizes:
    train: 354324
    validation: 118108
    test: 118108
  expected_boundaries:
    validation_start: 8745798.0
    test_start: 12192900.0
  expected_total_rows: 590540

paths:
  transaction: data/raw/ieee_cis/train_transaction.csv
  identity: data/raw/ieee_cis/train_identity.csv
  split_manifest_rows: data/processed/ieee_cis/split_manifest_rows.csv
  cw002_audit_json: artifacts/reports/cw002_ieee_cis/audit.json
  cw002_split_manifest_json: artifacts/reports/cw002_ieee_cis/split_manifest.json
  outputs:
    report_dir: artifacts/reports/cw003_ieee_cis_baselines
    report_json: artifacts/reports/cw003_ieee_cis_baselines/report.json
    report_markdown: artifacts/reports/cw003_ieee_cis_baselines/report.md
    threshold_curve_csv: artifacts/reports/cw003_ieee_cis_baselines/threshold_curve.csv
    feature_manifest_json: artifacts/reports/cw003_ieee_cis_baselines/feature_manifest.json
    model_dir: artifacts/models/cw003
    dummy_pipeline: artifacts/models/cw003/dummy_pipeline.joblib
    logistic_pipeline: artifacts/models/cw003/logistic_regression_pipeline.joblib
    rule_state: artifacts/models/cw003/rule_baseline_state.json

columns:
  target: isFraud
  join_key: TransactionID
  split_time: TransactionDT

# 禁止字段：通过硬校验从源特征、转换后特征与模型输入中排除。任何一处出现即抛错。
forbidden_features:
  - isFraud
  - TransactionID
  - TransactionDT

derived:
  identity_present:
    enabled: true
    kind: categorical
    risk_note: >-
      该字段编码"是否有 identity 记录"，可能携带连接结构或数据采集差异信息，属于潜在代理变量。
      本轮登记该风险并把它作为显式特征使用，报告的风险登记表会列出它，不得据此推断业务含义。

train_only_filters:
  # 以下规则只在训练分区拟合，用于决定列是否保留。阈值在查看任何模型指标之前声明。
  max_missing_rate: 0.5
  # 理由：缺失率超过一半的列在插补后信息量低、噪声占比高；同时把稠密数值分支的宽度控制在
  # 本机可用内存（约 4 GiB）可承受范围内。该阈值不依据任何模型表现选择。
  drop_constant: true
  drop_all_null: true
  categorical:
    # 类别列只用于 one-hot；不做目标编码。高基数 one-hot 会迅速膨胀并诱导过拟合。
    max_cardinality: 50
    min_cardinality: 2

preprocessing:
  numeric:
    impute_strategy: median
    # 缺失指示器：为训练期存在缺失的数值列添加。宽度由 max_missing_rate 与列数共同界定，
    # 实际维度会写入 feature_manifest.json 与报告。
    add_missing_indicator: true
    scale: standard
    working_dtype: float32
  categorical:
    impute_strategy: most_frequent
    encoder: onehot
    handle_unknown: ignore
    sparse_output: true
    # 不做低频类别归并：宽度已由 max_cardinality 约束，保持类别到输出的映射简单可追溯。
    min_frequency: null
feature_allowlist:
  # 显式允许清单：枚举 CW-002 判定的 candidate_feature 列，逐列给出类型与理由代码。
  # 不使用“全部剩余列”这类隐式规则；本清单不含 target / join_key / split_only。
  reason_texts:
    anonymous: 匿名统计信号：语义不可从列名确认，禁止赋予业务含义；仅作为统计信号进入模型。存在未知代理或泄漏风险，本轮只登记该风险，不声称已排除（见报告风险登记表）。
    named_but_unconfirmed: 列名有业务暗示但未经公开确认：按匿名化发布的数据处理，不得断言其真实含义；仅作为统计信号使用。
  sources:
    train_transaction.csv:
      declared_numeric: 377
      declared_categorical: 14
      declared_total: 391
