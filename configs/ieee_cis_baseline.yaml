rule_baseline:
  # 透明的无标签尾部异常启发式：只看两个数值字段是否落在训练分区的高分位尾部。
  # 明确声明：它不是业务规则，也不是真实反欺诈规则，只是一个可解释的异常启发式基线。
  name: transparent_tail_anomaly
  kind: unsupervised_tail_heuristic
  disclaimer: >-
    该基线不使用标签，不对应任何已确认的业务含义，也不是真实机构使用的反欺诈规则。
    它只用于提供一个完全透明、可人工复核的下界参照。
  fields:
    - name: TransactionAmt
      rationale: >-
        数值字段，训练分区无缺失；作为"金额量级"的统计信号使用。列名有业务暗示但未经公开确认，
        不对其真实含义作断言。
    - name: C13
      rationale: >-
        匿名数值字段（C 前缀），训练分区无缺失；作为计数类统计信号使用。语义不可从列名确认，
        不得赋予业务含义。
  quantile: 0.99
  quantile_source: train
  scoring: mean_of_indicators
  score_values: [0.0, 0.5, 1.0]
  score_range: [0.0, 1.0]
  notes: >-
    命中数为 0/1/2，除以 2 得到 [0,1] 分数，因此该基线的阈值曲线只有有限的几个操作点；
    这是透明性的直接代价，报告会如实展示。

models:
  dummy:
    type: dummy_classifier
    params:
      strategy: prior
  # 固定参数，不做任何超参数搜索。若 lbfgs 未收敛，先记录警告与收敛诊断；仅允许与收敛直接
  # 相关的有限调整（如迭代上限），且必须在报告中记录理由，不得查看 test 指标后调整。
  #
  # max_iter 调整记录（唯一一次调整，理由来自收敛诊断而非任何 test 指标）：
  #   首次运行 max_iter=1000 时 lbfgs 达到迭代上限仍未收敛：
  #     n_iter_=[1000]，ConvergenceWarning: "lbfgs failed to converge after 1000
  #     iteration(s) (status=1): STOP: TOTAL NO. OF ITERATIONS REACHED LIMIT"。
  #   因此把迭代上限提高到 3000。这是与收敛直接相关的有限调整，不涉及特征、阈值或成本场景；
  #   首次运行的完整产物已存档在 artifacts/reports/cw003_ieee_cis_baselines/_run1_nonconverged/，
  #   两次运行的对照写入 WORK_LOG.md 与报告，不做覆盖式替换。
  logistic_regression:
    type: logistic_regression
    params:
      C: 1.0
      class_weight: balanced
      solver: lbfgs
      max_iter: 3000
      tol: 0.0001
    # 机器可读的调整记录，会原样写入报告的收敛诊断，便于验收者核对调整理由。
    adjustment_note: >-
      max_iter 由 1000 提高到 3000。理由仅来自收敛诊断：首次运行时 lbfgs 报
      "failed to converge after 1000 iteration(s) (status=1): STOP: TOTAL NO. OF
      ITERATIONS REACHED LIMIT"，n_iter_=[1000] 达到上限。本次调整不涉及特征清单、
      预处理、阈值网格或成本场景，也未参考任何 test 指标；首次运行的完整产物已存档，
      未被覆盖。若提高到 3000 后仍未收敛，将如实报告未收敛状态，不再继续提高。

thresholds:
  # 固定阈值网格：在运行前由本文件声明，不依据 validation 或 test 表现调整。
  # 由 start/stop/step 确定性展开为 [0.01, 0.02, ..., 0.99] 共 99 个阈值；
  # 展开后的完整网格会写入报告，便于核对。
  grid:
    start: 0.01
    stop: 0.99
    step: 0.01
  metric: f1
  # F1 阈值只在 validation 上选择。tie-break 必须确定：F1 高者优先，其次 Recall 高者，
  # 最后阈值更高者（更保守）。
  f1_tie_break: [f1_desc, recall_desc, threshold_desc]
  cost_units: 研究用相对成本单位
  cost_disclaimer: >-
    成本比例（FP:FN）是研究假设，不是真实银行的货币损失，也不代表任何机构的风险偏好。
    报告中的成本一律标注为"研究用相对单位"，不得换算为人民币、美元或真实损失金额。
  cost_scenarios:
    - name: fp_fn_1_1
      fp_cost: 1.0
      fn_cost: 1.0
      rationale: 误报与漏报等价的对称场景，作为中性参照。
    - name: fp_fn_1_5
      fp_cost: 1.0
      fn_cost: 5.0
      rationale: 漏报代价为误报 5 倍，接近"宁可多查也不放过"的偏保守设定。
    - name: fp_fn_1_20
      fp_cost: 1.0
      fn_cost: 20.0
      rationale: 漏报代价远高于误报的强保守场景，用于观察阈值对成本假设的敏感性。
  # 各成本场景只在 validation 上选最低成本阈值；并列时取更高阈值（更保守）。
  cost_tie_break: [cost_asc, threshold_desc]

limits:
  # 评估分区与一次性评估纪律
  evaluation_partition: test
  single_shot_test: true
  # 允许的最大阈值曲线行数（防止产物无界膨胀）；超出时按声明方式截断并记录。
  max_threshold_curve_rows: 5000
