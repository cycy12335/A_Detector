      sha256: 318907df567ec6fc8e2886c25a49413fc499f1dbc00110db397e161a72dcd7ed
      size: 40960
      supply: not_required
      fixture: null
      trust: "运行时产物；验收标准明确要求默认数据库不进入 Git。"
      note: "CW-014 采用「测试夹具消除依赖」：把「默认库不被整轮测试改写」改成会话级守卫（tests/conftest.py 的 guard_default_database），既不依赖开发机数据库、也不再断言某个固定字节摘要。CI 不再需要该文件；若它意外存在，ci_fetch_inputs.py 仍会校验摘要并在不符时失败关闭。"
