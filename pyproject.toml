[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-detector"
version = "0.1.0"
description = "交易风险识别与 AI 辅助调查研究原型（求职作品集，P0 工程地基）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
# CW-004：唯一授权的新依赖。官方 PyPI 二进制 wheel；不源码编译、不换模型框架。
# 未安装本 extra 时，CW-001 至 CW-003 的功能仍可导入，只有 CW-004 入口给出可操作错误。
tree = ["lightgbm>=4.5,<5"]
# CW-005：只读评分服务 MVP 的唯一授权新依赖。未安装本 extra 时，服务专项测试清晰跳过，
# CW-001 至 CW-004 的功能与测试不受影响。
service = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
]
# CW-011：仅本机负载测量使用；不进入服务运行时依赖。
performance = ["locust>=2.46,<3"]
# CW-012：静态检查唯一授权的新依赖。**精确锁定版本**（==），因为规则行为与诊断码
# 随 ruff 版本变化；不进入服务运行时依赖，未安装时只有总门禁的静态阶段失败关闭。
static = ["ruff==0.14.4"]

[tool.setuptools.packages.find]
where = ["src"]

# CW-012 冻结静态规则集。这是交给 `ruff` 的**完整**选择集，没有 ignore、没有 per-file
# ignores、没有 noqa 兜底。`project_gate/static_checks.py::FROZEN_RULES` 是权威来源并在
# 命令行上显式传入；本节只是让手工运行 `ruff check` 得到同一套结果，
# `tests/unit/test_cw012_static.py` 断言两者逐项相等，防止漂移。
#
# 选型理由（只用**正确性**与**导入卫生**规则，不用风格规则）：
#   E9  —— 语法错误（文件根本不能编译）
#   F63 —— 无效转义序列 / 对元组做断言 / 可疑比较
#   F7  —— 语句位置错误（循环外 break/continue 等）
#   F82 —— 未定义名称（含 __all__ 与局部变量先引用后赋值）
#   F811—— 未使用名称被重复定义（遮蔽与死代码）
#   F401—— 未使用的导入（重构残留）
[tool.ruff]
line-length = 100
target-version = "py311"
# 不读取任何继承配置，保证结果只由本节与命令行决定。
extend-exclude = [".venv", "artifacts", "data"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F811", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
